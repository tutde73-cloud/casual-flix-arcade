<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Catch - Casual Flix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0284c7; font-family: monospace; touch-action: none; }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none text-slate-900">

    <header class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 py-3 bg-white border-b-2 border-slate-800 z-30 shadow-sm">
        <a href="index.html" class="text-xs font-black text-slate-800 hover:text-sky-600">← EXIT</a>
        <div class="flex gap-4 text-xs font-black">
            <span class="text-sky-700">SCORE: <span id="scoreVal">0</span></span>
            <span class="text-rose-600">TIME: <span id="timeVal">45s</span></span>
        </div>
    </header>

    <div class="relative w-full h-full flex items-center justify-center bg-sky-200">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>
    </div>

    <!-- Start Overlay -->
    <div id="startOverlay" class="absolute inset-0 bg-slate-950/50 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-40">
        <div class="bg-white border-2 border-slate-800 shadow-[6px_6px_0px_0px_#1e293b] p-8 rounded-3xl max-w-xs w-full flex flex-col items-center">
            <span class="text-4xl mb-2">🎣</span>
            <h1 class="text-2xl font-black text-slate-900 mb-1">DEEP CATCH</h1>
            <p class="text-slate-600 text-xs mb-6">Catch friendly fish, avoid falling boots with easy taps.</p>
            <button onclick="startGame()" class="bg-amber-300 border-2 border-slate-800 shadow-[3px_3px_0px_0px_#1e293b] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none text-slate-900 font-black px-6 py-3 rounded-xl w-full transition">START FISHING 🌊</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/50 backdrop-blur-sm hidden flex flex-col items-center justify-center p-6 text-center z-40">
        <div class="bg-white border-2 border-slate-800 shadow-[6px_6px_0px_0px_#1e293b] p-8 rounded-3xl max-w-xs w-full flex flex-col items-center">
            <h2 class="text-2xl font-black text-rose-600 mb-1">TIME'S UP!</h2>
            <p class="text-slate-600 text-xs mb-4">Total Score: <span id="finalScore" class="font-bold text-sky-700">0</span></p>
            <button onclick="startGame()" class="bg-amber-300 border-2 border-slate-800 shadow-[3px_3px_0px_0px_#1e293b] text-slate-900 font-black px-6 py-2.5 rounded-xl w-full transition">PLAY AGAIN 🔄</button>
        </div>
    </div>

    <!-- Tap Controls -->
    <div class="absolute bottom-6 left-0 right-0 flex justify-between px-8 z-30 pointer-events-none">
        <button id="leftBtn" class="pointer-events-auto w-16 h-16 bg-white border-2 border-slate-800 shadow-[3px_3px_0px_0px_#1e293b] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none rounded-2xl text-slate-900 font-black text-xl transition">◀</button>
        <button id="rightBtn" class="pointer-events-auto w-16 h-16 bg-white border-2 border-slate-800 shadow-[3px_3px_0px_0px_#1e293b] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none rounded-2xl text-slate-900 font-black text-xl transition">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let score = 0, timeLeft = 45, isPlaying = false;
        let timer, spawner, hook = { x: canvas.width/2, y: 120, width: 35, height: 45, speed: 12 };
        let items = [], keys = { left: false, right: false };

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            score = 0; timeLeft = 45; items = [];
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('timeVal').textContent = timeLeft + 's';
            isPlaying = true;

            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeVal').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);

            if (spawner) clearInterval(spawner);
            spawner = setInterval(() => {
                if (!isPlaying) return;
                items.push({ x: Math.random() * (canvas.width - 60) + 30, y: canvas.height + 40, size: 30, speed: 2 + Math.random() * 2, isBad: Math.random() < 0.3 });
            }, 900);
        }

        const bindTouch = (id, dir) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys[dir] = true);
            btn.addEventListener('mouseup', () => keys[dir] = false);
        };
        bindTouch('leftBtn', 'left'); bindTouch('rightBtn', 'right');

        function update() {
            if (!isPlaying) return;
            if (keys.left) hook.x -= hook.speed;
            if (keys.right) hook.x += hook.speed;
            hook.x = Math.max(30, Math.min(canvas.width - 30, hook.x));

            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i]; itm.y -= itm.speed;
                let dist = Math.hypot(hook.x - itm.x, hook.y - itm.y);
                if (dist < 35) {
                    score += itm.isBad ? -4 : 10;
                    score = Math.max(0, score);
                    document.getElementById('scoreVal').textContent = score;
                    items.splice(i, 1);
                    continue;
                }
                if (itm.y < -50) items.splice(i, 1);
            }
        }

        function draw() {
            // Air & Permukaan
            ctx.fillStyle = '#bae6fd'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(0, 0, canvas.width, 90); // Air dangkal atas
            
            // Garis Tali Kail
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(hook.x, 0); ctx.lineTo(hook.x, hook.y); ctx.stroke();

            // Bentuk Kail (Kail Vektor)
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(hook.x - 12, hook.y - 15, 24, 25);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
            ctx.strokeRect(hook.x - 12, hook.y - 15, 24, 25);

            // Item Ikan / Sampah Vektor
            items.forEach(itm => {
                ctx.fillStyle = itm.isBad ? '#f43f5e' : '#34d399';
                ctx.beginPath(); ctx.arc(itm.x, itm.y, itm.size/2, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();
            });

            if (isPlaying) { update(); requestAnimationFrame(draw); }
        }
        draw();

        function endGame() {
            isPlaying = false; clearInterval(timer); clearInterval(spawner);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
