<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Catch</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    /* Mengunci layar penuh agar tidak bisa ditarik/scroll sama sekali di iPad */
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #0f1026 0%, #05050d 100%);
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }

    .glass-panel {
      background: rgba(18, 22, 41, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .glass-btn {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease-in-out;
    }

    .glass-btn:hover {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.55) 0%, rgba(236, 72, 153, 0.55) 100%);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }

    .glass-btn:active {
      transform: translateY(1px);
    }

    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .neon-text-gold {
      text-shadow: 0 0 10px rgba(234, 179, 8, 0.8), 0 0 20px rgba(234, 179, 8, 0.4);
    }

    /* Ukuran kanvas proporsional besar untuk iPad */
    canvas {
      width: 100%;
      max-width: 580px;
      height: auto;
      max-height: 75vh;
      display: block;
      margin: 0 auto;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <!-- HUD Header -->
  <header class="w-full max-w-[580px] glass-panel rounded-2xl p-3 flex justify-between items-center z-10 shadow-lg shrink-0">
    <div class="flex items-center space-x-4">
      <div>
        <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Score</p>
        <p id="scoreEl" class="text-2xl font-black text-cyan-400 neon-text-cyan">0</p>
      </div>
      <div class="h-8 w-px bg-white/10"></div>
      <div>
        <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">High Score</p>
        <p id="highScoreEl" class="text-xl font-black text-amber-400 neon-text-gold">0</p>
      </div>
    </div>

    <!-- Health & Controls -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1 bg-black/40 px-3 py-1.5 rounded-xl border border-white/10" id="livesContainer">
        <span class="text-rose-500 text-lg">❤️</span>
        <span class="text-rose-500 text-lg">❤️</span>
        <span class="text-rose-500 text-lg">❤️</span>
      </div>
      <a href="index.html" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 transition text-sm" title="Home">🏠</a>
    </div>
  </header>

  <!-- Game Canvas Container -->
  <main id="canvasContainer" class="relative w-full max-w-[580px] rounded-3xl overflow-hidden glass-panel border border-white/10 flex justify-center items-center shrink-0">
    <canvas id="gameCanvas"></canvas>

    <!-- Start Overlay Screen -->
    <div id="startOverlay" class="absolute inset-0 flex flex-col justify-center items-center p-6 text-center z-20 bg-slate-950/85 backdrop-blur-md">
      <h1 class="text-4xl sm:text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-amber-400 tracking-tight">
        NEON CATCH
      </h1>
      <p class="text-slate-300 text-xs sm:text-sm max-w-xs mb-8 leading-relaxed">
        Catch falling neon items and avoid red bombs to set a high score!
      </p>

      <button id="startBtn" class="px-8 py-4 rounded-2xl glass-btn font-extrabold text-lg text-white tracking-wider uppercase">
        Start Game
      </button>

      <div class="mt-8 flex items-center space-x-3 text-xs text-slate-400">
        <span>🖱️ Drag Mouse</span>
        <span>•</span>
        <span>👆 Touch Swipe</span>
      </div>
    </div>

    <!-- Game Over Overlay Screen -->
    <div id="gameOverOverlay" class="absolute inset-0 flex flex-col justify-center items-center p-6 text-center z-20 hidden bg-black/85 backdrop-blur-md">
      <h2 class="text-4xl font-black mb-1 text-rose-500 drop-shadow-[0_0_15px_rgba(244,63,94,0.6)]">
        GAME OVER
      </h2>
      <p id="newHighScoreTag" class="text-amber-400 text-xs font-bold tracking-widest uppercase mb-4 hidden neon-text-gold">
        🏆 NEW HIGH SCORE! 🏆
      </p>

      <div class="glass-panel rounded-2xl p-4 w-60 mb-6 space-y-2 border border-white/10">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400">Final Score:</span>
          <span id="finalScoreEl" class="text-xl font-bold text-cyan-400">0</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400">Best Score:</span>
          <span id="bestScoreEl" class="text-xl font-bold text-amber-400">0</span>
        </div>
      </div>

      <button id="restartBtn" class="px-8 py-3.5 rounded-2xl glass-btn font-extrabold text-base text-white uppercase tracking-wider">
        Play Again
      </button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const highScoreEl = document.getElementById('highScoreEl');
    const livesContainer = document.getElementById('livesContainer');

    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const newHighScoreTag = document.getElementById('newHighScoreTag');
    const finalScoreEl = document.getElementById('finalScoreEl');
    const bestScoreEl = document.getElementById('bestScoreEl');

    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let gameState = 'START';
    let score = 0;
    let highScore = parseInt(localStorage.getItem('neon_catch_highscore')) || 0;
    let lives = 3;

    const basketWidth = 110;
    const basketHeight = 22;
    let basket = {
      x: 0,
      targetX: 0,
      y: 0,
      width: basketWidth,
      height: basketHeight
    };

    let items = [];
    let particles = [];

    function resizeCanvas() {
      canvas.width = 600;
      canvas.height = 720;
      basket.y = canvas.height - 45;
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      updateLivesUI();

      basket.x = canvas.width / 2 - basket.width / 2;
      basket.targetX = basket.x;
      items = [];
      particles = [];
      gameState = 'PLAYING';
    }

    function updateLivesUI() {
      let heartsHtml = '';
      for (let i = 0; i < 3; i++) {
        if (i < lives) {
          heartsHtml += `<span class="text-rose-500 text-lg">❤️</span>`;
        } else {
          heartsHtml += `<span class="text-slate-600 text-lg opacity-40">🖤</span>`;
        }
      }
      livesContainer.innerHTML = heartsHtml;
    }

    function updateBasketPosition(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const relativeX = (clientX - rect.left) * scaleX;
      basket.targetX = relativeX - basket.width / 2;
    }

    canvas.addEventListener('mousemove', (e) => updateBasketPosition(e.clientX));
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updateBasketPosition(e.touches[0].clientX);
    });

    startBtn.addEventListener('click', () => {
      startOverlay.classList.add('hidden');
      initGame();
      requestAnimationFrame(gameLoop);
    });

    restartBtn.addEventListener('click', () => {
      gameOverOverlay.classList.add('hidden');
      initGame();
      requestAnimationFrame(gameLoop);
    });

    function gameLoop() {
      if (gameState !== 'PLAYING') return;
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      basket.x += (basket.targetX - basket.x) * 0.25;
      if (basket.x < 0) basket.x = 0;
      if (basket.x + basket.width > canvas.width) basket.x = canvas.width - basket.width;

      if (Math.random() < 0.04) {
        const isBomb = Math.random() < 0.22;
        items.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -30,
          radius: 16,
          speed: 3 + Math.random() * 3.5,
          type: isBomb ? 'bomb' : 'fruit',
          color: isBomb ? '#ef4444' : '#ec4899'
        });
      }

      for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed;

        // Catch check
        if (it.y + it.radius >= basket.y && 
            it.y - it.radius <= basket.y + basket.height &&
            it.x >= basket.x && it.x <= basket.x + basket.width) {
          
          if (it.type === 'bomb') {
            lives--;
            updateLivesUI();
            if (lives <= 0) {
              endGame();
            }
          } else {
            score += 10;
            scoreEl.textContent = score;
          }
          items.splice(i, 1);
        } else if (it.y > canvas.height + 30) {
          items.splice(i, 1);
        }
      }
    }

    function endGame() {
      gameState = 'GAMEOVER';
      let isNewHigh = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_catch_highscore', highScore);
        highScoreEl.textContent = highScore;
        isNewHigh = true;
      }

      finalScoreEl.textContent = score;
      bestScoreEl.textContent = highScore;

      if (isNewHigh) newHighScoreTag.classList.remove('hidden');
      else newHighScoreTag.classList.add('hidden');

      gameOverOverlay.classList.remove('hidden');
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Basket
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(basket.x, basket.y, basket.width, basket.height, 10);
      ctx.fillStyle = '#06b6d4';
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#06b6d4';
      ctx.fill();
      ctx.restore();

      // Render Items
      for (let it of items) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
        ctx.fillStyle = it.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = it.color;
        ctx.fill();
        ctx.restore();
      }
    }

    highScoreEl.textContent = highScore;
    resizeCanvas();
  </script>
</body>
</html>
