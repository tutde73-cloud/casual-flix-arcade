<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Catch - Casual HTML5 Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09090e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .stat-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hearts {
            color: #ff3366;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
        }
        canvas {
            max-height: 75vh !important;
            max-width: 95vw !important;
            display: block;
            margin: 0 auto;
            background: #0d0d15;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 14, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 12px;
            transition: opacity 0.3s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        p {
            margin: 5px 0 20px 0;
            color: #a0a0c0;
            font-size: 13px;
            text-align: center;
            padding: 0 20px;
        }
        .btn {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            border: none;
            color: #09090e;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }
        .pause-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
    <div class="game-header">
        <div class="stat-group">
            <span>SKOR:</span> <span id="scoreVal">0</span>
        </div>
        <div class="stat-group">
            <span class="hearts" id="livesVal">❤️❤️❤️</span>
        </div>
        <button class="pause-btn" id="pauseBtn">PAUSE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="startOverlay" class="overlay">
        <h1>DEEP CATCH</h1>
        <p>Tangkap buah merah & koin emas. Hindari bom ungu berbahaya!</p>
        <button class="btn" id="startBtn">MULAI MAIN</button>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>GAME DI-PAUSE</h1>
        <p>Tarik napas sebentar...</p>
        <button class="btn" id="resumeBtn">LANJUTKAN</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p>Skor Akhir: <span id="finalScore">0</span><br>High Score: <span id="highScoreVal">0</span></p>
        <button class="btn" id="restartBtn">MAIN LAGI</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameWrapper = document.getElementById('gameWrapper');
    
    const scoreValEl = document.getElementById('scoreVal');
    const livesValEl = document.getElementById('livesVal');
    const finalScoreEl = document.getElementById('finalScore');
    const highScoreValEl = document.getElementById('highScoreVal');
    
    const startOverlay = document.getElementById('startOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    
    const startBtn = document.getElementById('startBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let gameState = 'START'; 
    let score = 0;
    let lives = 3;
    let highScore = localStorage.getItem('deep_catch_highscore') || 0;
    let gameSpeedMultiplier = 1;

    const catcher = {
        x: 200,
        y: 500,
        width: 75,
        height: 22,
        targetX: 200,
        speed: 0.15
    };

    let items = [];
    let particles = [];
    let spawnTimer = 0;
    let spawnInterval = 60;

    function resizeGame() {
        const targetWidth = 400;
        canvas.width = targetWidth;
        canvas.height = Math.min(window.innerHeight * 0.75, 600);
        catcher.y = canvas.height - 50;
    }

    window.addEventListener('resize', resizeGame);
    resizeGame();

    function handlePointerMove(clientX) {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        catcher.targetX = (clientX - rect.left) * scaleX;
    }

    window.addEventListener('mousemove', (e) => {
        handlePointerMove(e.clientX);
    });

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            handlePointerMove(e.touches[0].clientX);
        }
    }, { passive: true });

    class Item {
        constructor() {
            this.radius = 14;
            this.x = Math.random() * (canvas.width - 40) + 20;
            this.y = -30;
            
            const rand = Math.random();
            if (rand < 0.15) {
                this.type = 'COIN';
                this.color = '#ffcc00';
                this.points = 50;
                this.radius = 12;
            } else if (rand < 0.45) {
                this.type = 'BOMB';
                this.color = '#ff3366';
                this.points = 0;
                this.radius = 15;
            } else {
                this.type = 'FRUIT';
                this.color = '#ff0055';
                this.points = 10;
                this.radius = 14;
            }
            
            this.speed = (Math.random() * 1.5 + 2) * gameSpeedMultiplier;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.05;
        }

        update() {
            this.y += this.speed;
            this.rotation += this.rotSpeed;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;

            if (this.type === 'COIN') {
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (this.type === 'BOMB') {
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                // Bomb fuse
                ctx.strokeStyle = '#a0a0a0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(4, -this.radius - 8);
                ctx.stroke();
            } else {
                // Fruit cherry style
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                // Leaf
                ctx.fillStyle = '#00ffaa';
                ctx.beginPath();
                ctx.ellipse(2, -this.radius, 5, 3, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.02;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.1; // gravity
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function triggerScreenShake() {
        gameWrapper.classList.add('shake');
        setTimeout(() => {
            gameWrapper.classList.remove('shake');
        }, 200);
    }

    function updateGame() {
        if (gameState !== 'PLAYING') return;

        // Smooth Lerp for Catcher
        catcher.x += (catcher.targetX - catcher.x) * catcher.speed;
        
        // Clamp catcher inside canvas bounds
        const halfWidth = catcher.width / 2;
        if (catcher.x < halfWidth) catcher.x = halfWidth;
        if (catcher.x > canvas.width - halfWidth) catcher.x = canvas.width - halfWidth;

        // Progressive difficulty
        gameSpeedMultiplier = 1 + (score / 500);

        // Spawn logic
        spawnTimer++;
        if (spawnTimer >= Math.max(20, spawnInterval - Math.floor(score / 30))) {
            items.push(new Item());
            spawnTimer = 0;
        }

        // Update items
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.update();

            // Collision detection with catcher
            const hitBoxTop = catcher.y - catcher.height / 2;
            const hitBoxBottom = catcher.y + catcher.height / 2;
            const hitBoxLeft = catcher.x - catcher.width / 2;
            const hitBoxRight = catcher.x + catcher.width / 2;

            if (
                item.y + item.radius >= hitBoxTop &&
                item.y - item.radius <= hitBoxBottom &&
                item.x >= hitBoxLeft &&
                item.x <= hitBoxRight
            ) {
                if (item.type === 'BOMB') {
                    lives--;
                    triggerScreenShake();
                    spawnParticles(item.x, item.y, '#ff3366');
                } else {
                    score += item.points;
                    spawnParticles(item.x, item.y, item.color);
                }

                scoreValEl.innerText = score;
                updateLivesDisplay();

                items.splice(i, 1);

                if (lives <= 0) {
                    endGame();
                }
                continue;
            }

            // Remove out-of-bounds items
            if (item.y > canvas.height + 30) {
                items.splice(i, 1);
            }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function updateLivesDisplay() {
        let heartsStr = '';
        for (let i = 0; i < lives; i++) {
            heartsStr += '❤️';
        }
        livesValEl.innerText = heartsStr;
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw background grid lines for visual depth
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        // Draw Items
        items.forEach(item => item.draw());

        // Draw Particles
        particles.forEach(p => p.draw());

        // Draw Catcher (Neon Bowl)
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        
        const cx = catcher.x;
        const cy = catcher.y;
        const cw = catcher.width;
        const ch = catcher.height;

        ctx.beginPath();
        ctx.moveTo(cx - cw/2, cy - ch/2);
        ctx.lineTo(cx + cw/2, cy - ch/2);
        ctx.lineTo(cx + cw/2 - 8, cy + ch/2);
        ctx.lineTo(cx - cw/2 + 8, cy + ch/2);
        ctx.closePath();
        ctx.fill();

        // Inner bowl rim glow
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - cw/2 - 4, cy - ch/2);
        ctx.lineTo(cx + cw/2 + 4, cy - ch/2);
        ctx.stroke();

        ctx.restore();
    }

    function gameLoop() {
        updateGame();
        drawGame();
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        score = 0;
        lives = 3;
        gameSpeedMultiplier = 1;
        items = [];
        particles = [];
        spawnTimer = 0;
        scoreValEl.innerText = score;
        updateLivesDisplay();
        
        catcher.x = canvas.width / 2;
        catcher.targetX = canvas.width / 2;

        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        
        gameState = 'PLAYING';
    }

    function pauseGame() {
        if (gameState !== 'PLAYING') return;
        gameState = 'PAUSED';
        pauseOverlay.classList.remove('hidden');
    }

    function resumeGame() {
        if (gameState !== 'PAUSED') return;
        pauseOverlay.classList.add('hidden');
        gameState = 'PLAYING';
    }

    function endGame() {
        gameState = 'GAMEOVER';
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('deep_catch_highscore', highScore);
        }
        finalScoreEl.innerText = score;
        highScoreValEl.innerText = highScore;
        gameOverOverlay.classList.remove('hidden');
    }

    // Event Listeners for UI buttons
    startBtn.addEventListener('click', startGame);
    resumeBtn.addEventListener('click', resumeGame);
    restartBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', pauseGame);

    // Initial render call to display static background elements
    drawGame();
    
    // Start game animation loop
    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
