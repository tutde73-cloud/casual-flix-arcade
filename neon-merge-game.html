<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Merge - Casual Physics Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #06080d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(15, 20, 30, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-bottom: none;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .stat-group span:last-child {
            color: #00ffff;
            font-size: 15px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        .next-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mini-circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        canvas {
            max-height: 75vh !important;
            max-width: 95vw !important;
            display: block;
            margin: 0 auto;
            background: #0c1017;
            border: 2px solid #283344;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 8, 13, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 14px;
            transition: opacity 0.3s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 30px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
        }
        p {
            margin: 5px 0 20px 0;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 0 20px;
        }
        .btn {
            background: linear-gradient(135deg, #00ffff, #0077ff);
            border: none;
            color: #06080d;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 28px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        .pause-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
    <div class="game-header">
        <div class="stat-group">
            <span>SKOR</span>
            <span id="scoreVal">0</span>
        </div>
        <div class="next-preview">
            <span style="font-size: 11px; color: #94a3b8;">NEXT:</span>
            <div class="mini-circle" id="nextColorDot" style="background: #ff3366; color: #ff3366;"></div>
        </div>
        <button class="pause-btn" id="pauseBtn">PAUSE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="startOverlay" class="overlay">
        <h1>NEON MERGE</h1>
        <p>Gabungkan lingkaran warna senada untuk evolusi maksimal & raih skor tertinggi!</p>
        <button class="btn" id="startBtn">MULAI MAIN</button>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>GAME DI-PAUSE</h1>
        <p>Tarik napas sejenak...</p>
        <button class="btn" id="resumeBtn">LANJUTKAN</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p>Tumpukan melewati batas garis merah!<br>Skor Akhir: <span id="finalScore">0</span><br>High Score: <span id="highScoreVal">0</span></p>
        <button class="btn" id="restartBtn">MAIN LAGI</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const scoreValEl = document.getElementById('scoreVal');
    const finalScoreEl = document.getElementById('finalScore');
    const highScoreValEl = document.getElementById('highScoreVal');
    const nextColorDot = document.getElementById('nextColorDot');
    
    const startOverlay = document.getElementById('startOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    
    const startBtn = document.getElementById('startBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let gameState = 'START';
    let score = 0;
    let highScore = localStorage.getItem('neon_merge_highscore') || 0;

    // 6 Tingkatan Evolusi Lingkaran (Tier 0 sampai 5)
    const TIERS = [
        { radius: 16, color: '#ff2a6d', points: 2 },
        { radius: 24, color: '#05d9e8', points: 6 },
        { radius: 34, color: '#ff007f', points: 18 },
        { radius: 46, color: '#d300ff', points: 54 },
        { radius: 60, color: '#39ff14', points: 162 },
        { radius: 76, color: '#ffe600', points: 486 }
    ];

    let balls = [];
    let particles = [];
    let currentSpawnTier = 0;
    let nextSpawnTier = 0;
    let dropX = 200;
    let canDrop = true;
    let gameOverTimer = 0;
    const DANGER_LINE_Y = 85;

    function resizeGame() {
        const targetWidth = 400;
        canvas.width = targetWidth;
        canvas.height = Math.min(window.innerHeight * 0.75, 600);
        dropX = Math.max(30, Math.min(canvas.width - 30, dropX));
    }

    window.addEventListener('resize', resizeGame);
    resizeGame();

    class Ball {
        constructor(x, y, tier) {
            this.x = x;
            this.y = y;
            this.tier = tier;
            this.radius = TIERS[tier].radius;
            this.color = TIERS[tier].color;
            this.vx = 0;
            this.vy = 0;
            this.mass = this.radius * this.radius;
            this.isMerged = false;
        }

        update() {
            // Gravitasi
            this.vy += 0.35;
            
            // Gesekan udara
            this.vx *= 0.98;
            this.vy *= 0.98;

            this.x += this.vx;
            this.y += this.vy;

            // Batas dinding kiri & kanan
            const margin = this.radius;
            if (this.x < margin) {
                this.x = margin;
                this.vx *= -0.4;
            } else if (this.x > canvas.width - margin) {
                this.x = canvas.width - margin;
                this.vx *= -0.4;
            }

            // Batas bawah lantai dinamis
            const floorY = canvas.height - this.radius;
            if (this.y > floorY) {
                this.y = floorY;
                this.vy *= -0.3; // Pantulan elastis lantai
                this.vx *= 0.85;  // Gesekan lantai
            }
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();

            // Efek kilau interior neon
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 1.5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.04 + 0.02;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.15;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 14; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function getRandomStartTier() {
        // Peluang muncul tier bawah (0, 1, atau 2)
        const rand = Math.random();
        if (rand < 0.5) return 0;
        if (rand < 0.85) return 1;
        return 2;
    }

    function updateNextPreview() {
        nextSpawnTier = getRandomStartTier();
        nextColorDot.style.background = TIERS[nextSpawnTier].color;
        nextColorDot.style.color = TIERS[nextSpawnTier].color;
    }

    function handlePointerMove(clientX) {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const rawX = (clientX - rect.left) * scaleX;
        
        // Batasi posisi jatuhnya agar tidak keluar kanvas
        const currentRadius = TIERS[currentSpawnTier].radius;
        dropX = Math.max(currentRadius, Math.min(canvas.width - currentRadius, rawX));
    }

    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX));
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX);
    }, { passive: true });

    canvas.addEventListener('click', (e) => {
        triggerDrop();
    });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        triggerDrop();
    });

    function triggerDrop() {
        if (gameState !== 'PLAYING' || !canDrop) return;
        
        balls.push(new Ball(dropX, 45, currentSpawnTier));
        canDrop = false;

        currentSpawnTier = nextSpawnTier;
        updateNextPreview();

        setTimeout(() => {
            canDrop = true;
        }, 400);
    }

    function resolveCollisions() {
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i];
                let b2 = balls[j];

                if (b1.isMerged || b2.isMerged) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.hypot(dx, dy);
                let minDist = b1.radius + b2.radius;

                if (dist < minDist) {
                    // Jika tier sama dan belum maksimal, lakukan merge
                    if (b1.tier === b2.tier && b1.tier < TIERS.length - 1) {
                        b1.isMerged = true;
                        b2.isMerged = true;

                        let newX = (b1.x + b2.x) / 2;
                        let newY = (b1.y + b2.y) / 2;
                        let nextTier = b1.tier + 1;

                        score += TIERS[b1.tier].points * 2;
                        scoreValEl.innerText = score;

                        spawnParticles(newX, newY, TIERS[nextTier].color);

                        setTimeout(() => {
                            balls.push(new Ball(newX, newY, nextTier));
                        }, 10);

                    } else {
                        // Pantulan elastis fisika tumbukan
                        let overlap = 0.5 * (minDist - dist);
                        let nx = dx / dist;
                        let ny = dy / dist;

                        // Koreksi posisi agar tidak saling tembus
                        b1.x -= nx * overlap;
                        b1.y -= ny * overlap;
                        b2.x += nx * overlap;
                        b2.y += ny * overlap;

                        // Vektor kecepatan relatif
                        let kx = b1.vx - b2.vx;
                        let ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

                        b1.vx -= p * b2.mass * nx * 0.8;
                        b1.vy -= p * b2.mass * ny * 0.8;
                        b2.vx += p * b1.mass * nx * 0.8;
                        b2.vy += p * b1.mass * ny * 0.8;
                    }
                }
            }
        }

        // Hapus bola yang sudah di-merge
        balls = balls.filter(b => !b.isMerged);
    }

    function checkGameOverCondition() {
        let isAboveDanger = false;
        
        for (let ball of balls) {
            // Cek bola yang sudah tenang/menumpuk di atas garis bahaya
            if (ball.y - ball.radius < DANGER_LINE_Y && Math.abs(ball.vy) < 0.8 && Math.abs(ball.vx) < 0.8) {
                isAboveDanger = true;
                break;
            }
        }

        if (isAboveDanger) {
            gameOverTimer += 16.66; // Mendekati milidetik per frame (60fps)
            if (gameOverTimer >= 3000) { // 3 detik berturut-turut
                endGame();
            }
        } else {
            gameOverTimer = Math.max(0, gameOverTimer - 20);
        }
    }

    function updateGame() {
        if (gameState !== 'PLAYING') return;

        balls.forEach(ball => ball.update());
        resolveCollisions();
        
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.alpha > 0);

        checkGameOverCondition();
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Gambar Garis Batas Bahaya (Merah Putus-putus)
        ctx.save();
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.moveTo(0, DANGER_LINE_Y);
        ctx.lineTo(canvas.width, DANGER_LINE_Y);
        ctx.stroke();
        ctx.restore();

        // Indikator Garis Penunjuk Jatuh & Preview Bola di Atas
        if (gameState === 'PLAYING') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(dropX, 45);
            ctx.lineTo(dropX, canvas.height);
            ctx.stroke();

            // Bola yang siap dijatuhkan di kursor
            if (canDrop) {
                const currentRadius = TIERS[currentSpawnTier].radius;
                const currentColor = TIERS[currentSpawnTier].color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = currentColor;
                ctx.fillStyle = currentColor;
                ctx.beginPath();
                ctx.arc(dropX, 30, currentRadius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Gambar Semua Bola Fisika
        balls.forEach(ball => ball.draw());

        // Gambar Partikel Efek Ledakan
        particles.forEach(p => p.draw());

        // Visual pengingat indikator waktu game over meluap
        if (gameOverTimer > 0) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 51, 102, ${Math.min(0.8, gameOverTimer / 3000)})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
    }

    function gameLoop() {
        updateGame();
        drawGame();
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        score = 0;
        balls = [];
        particles = [];
        gameOverTimer = 0;
        scoreValEl.innerText = score;
        
        currentSpawnTier = getRandomStartTier();
        updateNextPreview();
        
        dropX = canvas.width / 2;
        canDrop = true;

        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        
        gameState = 'PLAYING';
    }

    function pauseGame() {
        if (gameState !== 'PLAYING') return;
        gameState = 'PAUSED';
        pauseOverlay.classList.remove('hidden');
    }

    function resumeGame() {
        if (gameState !== 'PAUSED') return;
        pauseOverlay.classList.add('hidden');
        gameState = 'PLAYING';
    }

    function endGame() {
        gameState = 'GAMEOVER';
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('neon_merge_highscore', highScore);
        }
        finalScoreEl.innerText = score;
        highScoreValEl.innerText = highScore;
        gameOverOverlay.classList.remove('hidden');
    }

    // Event Listener Tombol UI
    startBtn.addEventListener('click', startGame);
    resumeBtn.addEventListener('click', resumeGame);
    restartBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', pauseGame);

    // Render frame awal
    drawGame();
    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
