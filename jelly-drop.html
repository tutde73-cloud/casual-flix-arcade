<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelly Drop - Casual Flix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05050a; font-family: monospace; touch-action: none; }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none text-white">

    <header class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 py-3 bg-slate-950/80 border-b border-slate-800 backdrop-blur-md z-30 pointer-events-none">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white pointer-events-auto">← EXIT</a>
        <div class="flex gap-3 text-xs font-black">
            <span class="text-yellow-400">DISTANCE: <span id="scoreVal">0m</span></span>
            <span class="text-rose-500">HP: <span id="hpVal">❤️❤️❤️</span></span>
        </div>
    </header>

    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <div id="startOverlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-40">
        <h1 class="text-3xl md:text-5xl font-black text-yellow-400 mb-2">JELLY DROP 🍮</h1>
        <p class="text-slate-400 text-xs max-w-xs mb-6">Tap the button to jump over obstacles smoothly.</p>
        <button onclick="initGame()" class="bg-yellow-500 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg">START RUN 🚀</button>
    </div>

    <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/95 hidden flex flex-col items-center justify-center p-6 text-center z-40">
        <h2 class="text-3xl font-black text-rose-500 mb-2">OOPS!</h2>
        <p class="text-slate-300 text-sm mb-4">Total Distance: <span id="finalScore" class="font-bold text-yellow-400">0m</span></p>
        <button onclick="initGame()" class="bg-yellow-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl">TRY AGAIN 🔄</button>
    </div>

    <div class="absolute bottom-6 left-0 right-0 flex justify-center z-30 pointer-events-none">
        <button id="jumpBtn" class="pointer-events-auto bg-yellow-500 text-slate-950 font-black px-12 py-4 rounded-2xl shadow-xl text-base uppercase active:scale-95 transition">TAP TO JUMP 🧗‍♂️</button>
    </div>

    <script>
        let scene, camera, renderer, jelly;
        let distance = 0, hp = 3, isPlaying = false, gameLoop, spawner;
        let obstacles = [], isJumping = false, jumpVel = 0;

        function initGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            distance = 0; hp = 3;
            document.getElementById('scoreVal').textContent = '0m';
            document.getElementById('hpVal').textContent = '❤️❤️❤️';
            obstacles.forEach(obs => scene.remove(obs)); obstacles = [];

            if (!scene) setupScene();
            isPlaying = true;
            if (gameLoop) cancelAnimationFrame(gameLoop);
            if (spawner) clearInterval(spawner);
            spawner = setInterval(spawnObs, 1500);
            animate();
        }

        function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);
            scene.fog = new THREE.FogExp2(0x05050a, 0.04);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dir = new THREE.DirectionalLight(0x38bdf8, 1); dir.position.set(0, 10, 5); scene.add(dir);

            const track = new THREE.Mesh(new THREE.PlaneGeometry(8, 100), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            track.rotation.x = -Math.PI / 2; track.position.z = -40; scene.add(track);

            jelly = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0xeab308 }));
            jelly.position.set(0, 0.8, 0); scene.add(jelly);

            const jumpAction = () => { if (!isPlaying || isJumping) return; isJumping = true; jumpVel = 0.25; };
            document.getElementById('jumpBtn').addEventListener('pointerdown', jumpAction);
        }

        function spawnObs() {
            if (!isPlaying) return;
            const obs = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1), new THREE.MeshStandardMaterial({ color: 0xf43f5e }));
            obs.position.set((Math.random() - 0.5) * 4, 0.5, -50);
            scene.add(obs); obstacles.push(obs);
        }

        function animate() {
            if (!isPlaying) return;
            distance += 1;
            document.getElementById('scoreVal').textContent = distance + 'm';

            if (isJumping) {
                jelly.position.y += jumpVel; jumpVel -= 0.015;
                if (jelly.position.y <= 0.8) { jelly.position.y = 0.8; isJumping = false; }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.position.z += 0.4;
                if (jelly.position.distanceTo(obs.position) < 1.2 && jelly.position.y < 1.2) {
                    hp--;
                    document.getElementById('hpVal').textContent = '❤️'.repeat(Math.max(0, hp)) + '🖤'.repeat(3 - Math.max(0, hp));
                    scene.remove(obs); obstacles.splice(i, 1);
                    if (hp <= 0) { endGame(); return; }
                }
                if (obs.position.z > 5) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            camera.position.set(jelly.position.x, jelly.position.y + 3, jelly.position.z + 5);
            camera.lookAt(jelly.position.x, jelly.position.y, jelly.position.z - 5);
            renderer.render(scene, camera);
            gameLoop = requestAnimationFrame(animate);
        }

        function endGame() {
            isPlaying = false; cancelAnimationFrame(gameLoop); clearInterval(spawner);
            document.getElementById('finalScore').textContent = distance + 'm';
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
