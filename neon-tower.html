<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Tower - Casual Arcade Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #05070a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            max-height: 75vh !important;
            max-width: 95vw !important;
            display: block;
            margin: 0 auto;
            background: #0c1017;
            border: 2px solid #283344;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        .ui-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn {
            pointer-events: auto;
            background: rgba(20, 30, 48, 0.8);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .btn:hover {
            background: #00f3ff;
            color: #05070a;
            box-shadow: 0 0 15px #00f3ff;
        }
        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.7);
            letter-spacing: 2px;
        }
        p {
            margin: 5px 0 20px 0;
            color: #8b9bb4;
            font-size: 0.95rem;
            text-align: center;
        }
        .score-board {
            background: rgba(12, 16, 23, 0.9);
            border: 1px solid #283344;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .score-board div {
            font-size: 0.9rem;
            color: #8b9bb4;
        }
        .score-board span {
            font-size: 1.8rem;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="ui-group">
                <span id="scoreDisplay">SCORE: 0</span>
            </div>
            <div class="ui-group">
                <span id="livesDisplay">❤️❤️❤️</span>
                <button class="btn" id="pauseBtn">PAUSE</button>
            </div>
        </div>

        <div id="modal-overlay">
            <h1 id="modalTitle">NEON TOWER</h1>
            <p id="modalSubtitle">Stack blocks perfectly to reach the skyline!</p>
            
            <div class="score-board">
                <div>BEST SCORE</div>
                <span id="bestScoreDisplay">0</span>
            </div>

            <button class="btn" id="actionBtn" style="font-size: 1.2rem; padding: 12px 30px;">PLAY NOW</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const pauseBtn = document.getElementById('pauseBtn');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const bestScoreDisplay = document.getElementById('bestScoreDisplay');
        const actionBtn = document.getElementById('actionBtn');

        const GAME_WIDTH = 400;
        let gameHeight = 600;

        let gameState = 'START'; 
        let score = 0;
        let lives = 3;
        let bestScore = localStorage.getItem('neon_tower_best') || 0;

        let cameraY = 0;
        let targetCameraY = 0;

        let tower = [];
        let currentBlock = null;
        let particles = [];
        let floatingTexts = [];
        let backgroundStars = [];

        const blockHeight = 30;
        const initialBlockWidth = 140;
        let currentBlockWidth = initialBlockWidth;

        let swingAngle = 0;
        let swingSpeed = 0.03;
        let swingWidth = 130;

        let wobblyOffset = 0;
        let wobblyVelocity = 0;

        function initStars() {
            backgroundStars = [];
            for (let i = 0; i < 50; i++) {
                backgroundStars.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * gameHeight * 3,
                    size: Math.random() * 2,
                    alpha: Math.random()
                });
            }
        }

        function resizeGame() {
            canvas.width = GAME_WIDTH;
            gameHeight = Math.min(window.innerHeight * 0.75, 600);
            canvas.height = gameHeight;
            
            if (tower.length > 0) {
                targetCameraY = Math.max(0, (tower.length * blockHeight) - (gameHeight * 0.5));
                cameraY = targetCameraY;
            }
        }

        window.addEventListener('resize', resizeGame);
        resizeGame();
        initStars();

        function getNeonColor(index) {
            const colors = ['#00f3ff', '#ff007f', '#39ff14', '#bf00ff', '#ff5500', '#ffff00'];
            return colors[index % colors.length];
        }

        function resetGame() {
            score = 0;
            lives = 3;
            currentBlockWidth = initialBlockWidth;
            tower = [];
            particles = [];
            floatingTexts = [];
            cameraY = 0;
            targetCameraY = 0;
            wobblyOffset = 0;
            wobblyVelocity = 0;

            const baseWidth = 180;
            const baseY = gameHeight - 70;
            tower.push({
                x: (GAME_WIDTH - baseWidth) / 2,
                y: baseY,
                width: baseWidth,
                color: '#283344',
                isBase: true
            });

            spawnNewBlock();
            updateUI();
        }

        function spawnNewBlock() {
            const topBlock = tower[tower.length - 1];
            currentBlock = {
                width: currentBlockWidth,
                y: topBlock.y - blockHeight - 120,
                color: getNeonColor(score),
                state: 'SWINGING'
            };
            swingAngle = 0;
        }

        function dropBlock() {
            if (!currentBlock || currentBlock.state !== 'SWINGING') return;
            
            currentBlock.state = 'FALLING';
            currentBlock.vy = 0;
            currentBlock.gravity = 0.6;
        }

        function updateUI() {
            scoreDisplay.textContent = `SCORE: ${score}`;
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            livesDisplay.textContent = hearts;
            bestScoreDisplay.textContent = bestScore;
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('neon_tower_best', bestScore);
            }
            modalTitle.textContent = "GAME OVER";
            modalSubtitle.textContent = `You stacked ${score} neon levels!`;
            actionBtn.textContent = "PLAY AGAIN";
            modalOverlay.classList.remove('hidden');
            updateUI();
        }

        function addParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    alpha: 1,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                alpha: 1,
                color: color
            });
        }

        function update() {
            wobblyVelocity += -wobblyOffset * 0.15;
            wobblyVelocity *= 0.85;
            wobblyOffset += wobblyVelocity;

            cameraY += (targetCameraY - cameraY) * 0.1;

            if (gameState === 'PLAYING' && currentBlock) {
                if (currentBlock.state === 'SWINGING') {
                    swingAngle += swingSpeed;
                    const centerX = GAME_WIDTH / 2;
                    currentBlock.x = centerX + Math.sin(swingAngle) * swingWidth - currentBlock.width / 2;
                } else if (currentBlock.state === 'FALLING') {
                    currentBlock.vy += currentBlock.gravity;
                    currentBlock.y += currentBlock.vy;

                    const topBlock = tower[tower.length - 1];
                    const targetY = topBlock.y - blockHeight;

                    if (currentBlock.y >= targetY) {
                        currentBlock.y = targetY;
                        evaluateLanding();
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function evaluateLanding() {
            const topBlock = tower[tower.length - 1];
            const overlapLeft = Math.max(currentBlock.x, topBlock.x);
            const overlapRight = Math.min(currentBlock.x + currentBlock.width, topBlock.x + topBlock.width);
            const overlapWidth = overlapRight - overlapLeft;

            if (overlapWidth <= 0) {
                lives--;
                currentBlock.state = 'MISSED';
                addFloatingText("MISSED!", currentBlock.x + currentBlock.width / 2, currentBlock.y, '#ff0055');
                
                setTimeout(() => {
                    if (lives <= 0) {
                        triggerGameOver();
                    } else {
                        spawnNewBlock();
                        updateUI();
                    }
                }, 500);
                updateUI();
                return;
            }

            const centerDiff = (currentBlock.x + currentBlock.width / 2) - (topBlock.x + topBlock.width / 2);
            wobblyVelocity += centerDiff * 0.08;

            const isPerfect = Math.abs(centerDiff) < 4;
            
            if (isPerfect) {
                currentBlock.width = topBlock.width;
                currentBlock.x = topBlock.x;
                addParticles(currentBlock.x + currentBlock.width / 2, currentBlock.y, currentBlock.color);
                addFloatingText("PERFECT!", currentBlock.x + currentBlock.width / 2, currentBlock.y - 15, '#39ff14');
            } else {
                if (currentBlock.x < topBlock.x) {
                    currentBlock.width = (currentBlock.x + currentBlock.width) - topBlock.x;
                    currentBlock.x = topBlock.x;
                } else {
                    currentBlock.width = overlapRight - currentBlock.x;
                }
                currentBlock.x = overlapLeft;
                currentBlockWidth = currentBlock.width;
                addFloatingText("GOOD", currentBlock.x + currentBlock.width / 2, currentBlock.y - 15, '#00f3ff');
            }

            tower.push({
                x: currentBlock.x,
                y: currentBlock.y,
                width: currentBlock.width,
                color: currentBlock.color
            });

            score++;
            targetCameraY = Math.max(0, (tower.length * blockHeight) - (gameHeight * 0.5));

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('neon_tower_best', bestScore);
            }

            updateUI();
            spawnNewBlock();
        }

        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, gameHeight);

            ctx.save();
            ctx.translate(0, cameraY);

            for (let star of backgroundStars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }

            ctx.save();
            const topTowerBlock = tower[tower.length - 1];
            if (topTowerBlock) {
                ctx.translate(topTowerBlock.x + topTowerBlock.width / 2, topTowerBlock.y + blockHeight / 2);
                ctx.rotate(wobblyOffset * 0.005);
                ctx.translate(-(topTowerBlock.x + topTowerBlock.width / 2), -(topTowerBlock.y + blockHeight / 2));
            }

            for (let i = 0; i < tower.length; i++) {
                let block = tower[i];
                if (block.isBase) {
                    ctx.fillStyle = '#111823';
                    ctx.fillRect(block.x - 40, block.y, block.width + 80, gameHeight * 2);
                    ctx.strokeStyle = '#283344';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(block.x - 40, block.y, block.width + 80, gameHeight * 2);
                    continue;
                }

                ctx.shadowBlur = 12;
                ctx.shadowColor = block.color;
                ctx.fillStyle = block.color;
                ctx.fillRect(block.x, block.y, block.width, blockHeight);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(block.x, block.y, block.width, 4);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(block.x, block.y, block.width, blockHeight);
                ctx.shadowBlur = 0;
            }
            ctx.restore();

            if (currentBlock && gameState === 'PLAYING') {
                if (currentBlock.state === 'SWINGING') {
                    const centerX = GAME_WIDTH / 2;
                    const ropeTopY = cameraY - 100;
                    
                    ctx.strokeStyle = '#283344';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX, ropeTopY);
                    ctx.lineTo(currentBlock.x + currentBlock.width / 2, currentBlock.y);
                    ctx.stroke();

                    ctx.fillStyle = '#00f3ff';
                    ctx.beginPath();
                    ctx.arc(currentBlock.x + currentBlock.width / 2, currentBlock.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowBlur = 15;
                ctx.shadowColor = currentBlock.color;
                ctx.fillStyle = currentBlock.color;
                ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, 4);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight);
                ctx.shadowBlur = 0;
            }

            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            }

            for (let ft of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 16px "Segoe UI", sans-serif';
                ctx.fillStyle = ft.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = ft.color;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function handleInput(e) {
            if (e.target.closest('#modal-overlay') || e.target.closest('#pauseBtn')) return;
            if (gameState === 'PLAYING') {
                dropBlock();
            }
        }

        window.addEventListener('pointerdown', handleInput);

        actionBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            resetGame();
            gameState = 'PLAYING';
        });

        pauseBtn.addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                modalTitle.textContent = "GAME PAUSED";
                modalSubtitle.textContent = "Take a breath, resume anytime.";
                actionBtn.textContent = "RESUME";
                modalOverlay.classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                modalOverlay.classList.add('hidden');
                gameState = 'PLAYING';
            }
        });

        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
