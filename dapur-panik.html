<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dapur Panik - The Chaos Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #05050a; font-family: monospace;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none text-white">

    <!-- Top UI Bar -->
    <header class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 py-3 bg-slate-950/80 border-b border-slate-800 backdrop-blur-md z-30 pointer-events-none">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white pointer-events-auto">← Keluar</a>
        <div class="flex gap-4 text-xs font-black">
            <span class="text-yellow-400">SKOR: <span id="scoreVal">0</span></span>
            <span class="text-rose-500">WAKTU: <span id="timeVal">45s</span></span>
        </div>
    </header>

    <!-- Canvas Game 2D -->
    <div class="relative w-full h-full flex items-center justify-center bg-slate-950">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>
    </div>

    <!-- Start & Game Over Overlays -->
    <div id="startOverlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-40">
        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-rose-500 mb-2">
            DAPUR PANIK 🍳
        </h1>
        <p class="text-slate-400 text-xs max-w-xs mb-6">
            Tangkap bahan makanan segar, hindari racun, dan awasi zombie yang mencoba mendobrak kaca jendela dapur!
        </p>
        <button onclick="startGame()" class="bg-gradient-to-r from-yellow-500 to-rose-500 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg active:scale-95 transition">
            Mulai Masak 🚀
        </button>
    </div>

    <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/95 hidden flex flex-col items-center justify-center p-6 text-center z-40">
        <h2 class="text-3xl font-black text-rose-500 mb-2">WAKTU HABIS!</h2>
        <p class="text-slate-300 text-sm mb-4">Skor Akhir: <span id="finalScore" class="font-bold text-yellow-400">0</span></p>
        <button onclick="startGame()" class="bg-yellow-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl">
            Main Lagi 🔄
        </button>
    </div>

    <!-- Mobile Virtual Controls -->
    <div class="absolute bottom-6 left-0 right-0 flex justify-between px-8 z-30 pointer-events-none">
        <div class="flex gap-3 pointer-events-auto">
            <button id="leftBtn" class="w-16 h-16 bg-slate-900/80 border border-slate-700 rounded-2xl text-white font-bold text-xl active:bg-yellow-500 active:text-slate-950 transition">◀</button>
            <button id="rightBtn" class="w-16 h-16 bg-slate-900/80 border border-slate-700 rounded-2xl text-white font-bold text-xl active:bg-yellow-500 active:text-slate-950 transition">▶</button>
        </div>
    </div>

    <!-- Script Game 2D Retro Arcade -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let timeLeft = 45;
        let isPlaying = false;
        let gameTimer, itemSpawner;

        // Posisi Pemain (Koki)
        let player = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 140,
            width: 60,
            height: 60,
            speed: 8,
            dx: 0
        };

        let items = [];
        let keys = { left: false, right: false };

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            
            score = 0;
            timeLeft = 45;
            items = [];
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('timeVal').textContent = timeLeft + 's';

            isPlaying = true;

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeVal').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);

            if (itemSpawner) clearInterval(itemSpawner);
            itemSpawner = setInterval(spawnItem, 900);
        }

        function spawnItem() {
            if (!isPlaying) return;
            const isBad = Math.random() < 0.3;
            items.push({
                x: Math.random() * (canvas.width - 50),
                y: -50,
                size: 35,
                speed: 3 + Math.random() * 3,
                isBad: isBad
            });
        }

        // Kontrol Keyboard & Sentuh
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        const bindTouch = (id, dir) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys[dir] = true);
            btn.addEventListener('mouseup', () => keys[dir] = false);
        };
        bindTouch('leftBtn', 'left');
        bindTouch('rightBtn', 'right');

        function update() {
            if (!isPlaying) return;

            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            if (player.x < 20) player.x = 20;
            if (player.x > canvas.width - player.width - 20) player.x = canvas.width - player.width - 20;

            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.y += itm.speed;

                // Cek Tangkapan Pemain
                if (
                    itm.x < player.x + player.width &&
                    itm.x + itm.size > player.x &&
                    itm.y < player.y + player.height &&
                    itm.y + itm.size > player.y
                ) {
                    if (itm.isBad) {
                        score = Math.max(0, score - 5);
                    } else {
                        score += 10;
                    }
                    document.getElementById('scoreVal').textContent = score;
                    items.splice(i, 1);
                    continue;
                }

                // Hapus jika lewat bawah
                if (itm.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            // Latar Belakang Estetik Malam Hari ala Retro Arcade
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Efek Jendela Dapur di Belakang dengan Zombie Mengintip
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(canvas.width / 2 - 120, 60, 240, 150);
            ctx.strokeStyle = '#312e81';
            ctx.lineWidth = 4;
            ctx.strokeRect(canvas.width / 2 - 120, 60, 240, 150);

            // Kepala Zombie di Jendela
            ctx.fillStyle = '#15803d';
            ctx.fillRect(canvas.width / 2 - 40, 100, 80, 90);
            // Mata Merah Zombie
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(canvas.width / 2 - 25, 125, 15, 10);
            ctx.fillRect(canvas.width / 2 + 10, 125, 15, 10);

            // Meja Dapur / Counter Bawah
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 15);

            // Gambar Item Makanan / Racun
            items.forEach(itm => {
                ctx.fillStyle = itm.isBad ? '#f43f5e' : '#eab308';
                ctx.beginPath();
                ctx.arc(itm.x + itm.size/2, itm.y + itm.size/2, itm.size/2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Gambar Karakter Koki (Kotak Keren dengan Topi Chef)
            ctx.fillStyle = '#10b981';
            ctx.fillRect(player.x, player.y + 15, player.width, player.height - 15);
            // Topi Koki
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 10, player.y, 40, 20);

            if (isPlaying) {
                update();
                requestAnimationFrame(draw);
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearInterval(itemSpawner);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        // Jalankan loop render awal
        draw();
    </script>
</body>
</html>
