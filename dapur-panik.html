<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dapur Panik 3D - Serangan Zombie</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #05050a; font-family: sans-serif;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none">

    <!-- Top UI -->
    <header class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 py-3 bg-slate-900/80 border-b border-slate-800 backdrop-blur-md z-30 pointer-events-none">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white pointer-events-auto">← Keluar</a>
        <div class="flex gap-4 text-xs font-black">
            <span class="text-emerald-400">SKOR: <span id="scoreVal">0</span></span>
            <span class="text-rose-500">WAKTU: <span id="timeVal">45s</span></span>
        </div>
    </header>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <!-- Start & Game Over Overlays -->
    <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-40">
        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-emerald-400 mb-2">
            DAPUR PANIK: ZOMBIE ATTACK 🧟🍳
        </h1>
        <p class="text-slate-400 text-xs max-w-xs mb-6">
            Masak di dapur sambil waspada! Ada zombie yang mencoba mendobrak masuk dari kaca jendela dapur.
        </p>
        <button onclick="initGame()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg">
            Mulai Masak 🚀
        </button>
    </div>

    <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/90 hidden flex flex-col items-center justify-center p-6 text-center z-40">
        <h2 id="endTitle" class="text-3xl font-black text-rose-500 mb-2">WAKTU HABIS!</h2>
        <p class="text-slate-300 text-sm mb-4">Skor Akhir: <span id="finalScore" class="font-bold text-emerald-400">0</span></p>
        <button onclick="initGame()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-2.5 rounded-xl">
            Main Lagi 🔄
        </button>
    </div>

    <!-- Mobile Virtual Joystick / Buttons -->
    <div class="absolute bottom-6 left-6 right-6 flex justify-between items-end z-30 pointer-events-none">
        <div class="flex gap-2 pointer-events-auto">
            <button id="btnLeft" class="w-14 h-14 bg-slate-800/80 border border-slate-700 rounded-full text-white font-bold text-lg active:bg-slate-700">◀</button>
            <button id="btnRight" class="w-14 h-14 bg-slate-800/80 border border-slate-700 rounded-full text-white font-bold text-lg active:bg-slate-700">▶</button>
        </div>
        <div class="flex gap-2 pointer-events-auto">
            <button id="btnUp" class="w-14 h-14 bg-slate-800/80 border border-slate-700 rounded-full text-white font-bold text-lg active:bg-slate-700">▲</button>
            <button id="btnDown" class="w-14 h-14 bg-slate-800/80 border border-slate-700 rounded-full text-white font-bold text-lg active:bg-slate-700">▼</button>
        </div>
    </div>

    <!-- Script Game 3D Three.js dengan Suasana Dapur & Jendela Zombie -->
    <script>
        let scene, camera, renderer, player, zombieHead;
        let score = 0, timeLeft = 45, isPlaying = false;
        let gameTimer, itemSpawner;
        let collectibles = [];
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, KeyW: false, KeyS: false, KeyA: false, KeyD: false };

        function initGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            
            score = 0;
            timeLeft = 45;
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('timeVal').textContent = timeLeft + 's';

            collectibles.forEach(item => scene.remove(item.mesh));
            collectibles = [];

            if (!scene) {
                setupThreeJS();
            }

            isPlaying = true;
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeVal').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame('WAKTU HABIS!');
            }, 1000);

            if (itemSpawner) clearInterval(itemSpawner);
            itemSpawner = setInterval(spawnItem3D, 1200);
        }

        function setupThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Pencahayaan Suasana Dapur
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const kitchenLight = new THREE.PointLight(0xf59e0b, 1.2, 40); // Lampu gantung dapur warna kuning hangat
            kitchenLight.position.set(0, 8, 0);
            scene.add(kitchenLight);

            // Lantai Keramik Dapur
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Dinding Dapur
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 30), wallMat);
            wallLeft.position.set(-15, 5, 0);
            scene.add(wallLeft);

            const wallRight = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 30), wallMat);
            wallRight.position.set(15, 5, 0);
            scene.add(wallRight);

            // Dinding Belakang dengan Jendela Kaca
            const wallBack = new THREE.Mesh(new THREE.BoxGeometry(30, 10, 1), wallMat);
            wallBack.position.set(0, 5, -15);
            scene.add(wallBack);

            // --- KACA JENDELA DAPUR & ZOMBIE ---
            const glassGeo = new THREE.PlaneGeometry(6, 4);
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.25, roughness: 0.1 });
            const windowGlass = new THREE.Mesh(glassGeo, glassMat);
            windowGlass.position.set(0, 4, -14.8);
            scene.add(windowGlass);

            // Kepala Zombie di Balik Kaca Jendela yang Ingin Masuk
            const zombieGeo = new THREE.BoxGeometry(1.2, 1.4, 1.2);
            const zombieMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.7 }); // Kulit hijau zombie
            zombieHead = new THREE.Mesh(zombieGeo, zombieMat);
            zombieHead.position.set(0, 4, -15.2);
            scene.add(zombieHead);

            // Mata Zombie Menyala Merah di Kaca
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
            eye1.position.set(-0.3, 4.2, -14.6);
            scene.add(eye1);
            const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
            eye2.position.set(0.3, 4.2, -14.6);
            scene.add(eye2);

            // Meja Dapur / Countertop di Tengah Ruangan
            const counterGeo = new THREE.BoxGeometry(6, 1.5, 2);
            const counterMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const counter = new THREE.Mesh(counterGeo, counterMat);
            counter.position.set(0, 0.75, -5);
            scene.add(counter);

            // Karakter Pemain (Koki)
            const playerGeo = new THREE.BoxGeometry(1, 2, 1);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 1, 0);
            scene.add(player);

            window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

            bindTouch('btnUp', 'KeyW');
            bindTouch('btnDown', 'KeyS');
            bindTouch('btnLeft', 'KeyA');
            bindTouch('btnRight', 'KeyD');

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function bindTouch(elementId, keyCode) {
            const el = document.getElementById(elementId);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyCode] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyCode] = false; });
            el.addEventListener('mousedown', () => keys[keyCode] = true);
            el.addEventListener('mouseup', () => keys[keyCode] = false);
        }

        function spawnItem3D() {
            if (!isPlaying) return;
            const geo = new THREE.SphereGeometry(0.6, 16, 16);
            const isBad = Math.random() < 0.3;
            const mat = new THREE.MeshStandardMaterial({ color: isBad ? 0xf43f5e : 0xeab308, emissive: isBad ? 0x500000 : 0x504000 });
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.set(
                (Math.random() - 0.5) * 20,
                0.6,
                (Math.random() - 0.5) * 15
            );
            scene.add(mesh);
            collectibles.push({ mesh, isBad });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            // Efek Zombie Mendobrak Jendela (Kepala bergerak maju-mundur mencoba masuk)
            if (zombieHead) {
                zombieHead.position.z = -15.2 + Math.sin(Date.now() * 0.01) * 0.3;
            }

            let speed = 0.15;
            if (keys.ArrowUp || keys.KeyW) player.position.z -= speed;
            if (keys.ArrowDown || keys.KeyS) player.position.z += speed;
            if (keys.ArrowLeft || keys.KeyA) player.position.x -= speed;
            if (keys.ArrowRight || keys.KeyD) player.position.x += speed;

            player.position.x = Math.max(-13, Math.min(13, player.position.x));
            player.position.z = Math.max(-13, Math.min(13, player.position.z));

            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 6;
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position.x, player.position.y, player.position.z - 2);

            for (let i = collectibles.length - 1; i >= 0; i--) {
                let item = collectibles[i];
                let dist = player.position.distanceTo(item.mesh.position);
                if (dist < 1.5) {
                    if (item.isBad) {
                        score = Math.max(0, score - 3);
                    } else {
                        score += 5;
                    }
                    document.getElementById('scoreVal').textContent = score;
                    scene.remove(item.mesh);
                    collectibles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function endGame(reason) {
            isPlaying = false;
            clearInterval(gameTimer);
            clearInterval(itemSpawner);
            document.getElementById('endTitle').textContent = reason;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
