<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dapur Panik - Fullscreen Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        neonpink: '#f43f5e',
                        neongreen: '#10b981',
                        neonpurple: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none">

    <!-- Top Bar Minimalis -->
    <header class="flex justify-between items-center px-4 py-3 bg-slate-900/80 border-b border-slate-800 backdrop-blur-md z-30">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-1">
            ← Keluar
        </a>
        <div class="flex gap-4 text-xs font-black">
            <span class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-700 text-neongreen">SKOR: <span id="scoreVal">0</span></span>
            <span class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-700 text-neonpink">WAKTU: <span id="timeVal">30s</span></span>
        </div>
    </header>

    <!-- Canvas Fullscreen Area -->
    <main class="relative flex-grow flex items-center justify-center overflow-hidden w-full h-full">
        
        <!-- Start Menu Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-[#090d16]/95 flex flex-col items-center justify-center p-6 text-center z-40 backdrop-blur-sm">
            <div class="text-6xl mb-4 animate-bounce">🍳</div>
            <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-neonpink via-purple-400 to-neongreen mb-2">
                DAPUR PANIK
            </h1>
            <p class="text-slate-400 text-xs md:text-sm max-w-xs mb-8">
                Tangkap bahan makanan segar, hindari sampah secepat mungkin! Dilengkapi efek suara & animasi arcade.
            </p>
            <button onclick="startGame()" class="bg-gradient-to-r from-neonpink to-purple-600 hover:from-rose-600 hover:to-purple-700 text-white font-black px-8 py-4 rounded-2xl shadow-xl shadow-neonpink/20 transition transform active:scale-95 text-base uppercase tracking-wider">
                Mulai Main 🚀
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="absolute inset-0 bg-[#090d16]/95 hidden flex flex-col items-center justify-center p-6 text-center z-40 backdrop-blur-sm">
            <div class="text-6xl mb-3">💥</div>
            <h2 class="text-3xl font-black text-neonpink mb-1">WAKTU HABIS!</h2>
            <p class="text-slate-300 text-sm mb-6">Skor Akhir Kamu: <span id="finalScore" class="font-black text-neongreen text-xl">0</span></p>
            <button onclick="startGame()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg active:scale-95">
                Main Lagi 🔄
            </button>
        </div>

        <!-- Canvas Mengisi Seluruh Layar (Fullscreen) -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full block cursor-crosshair"></canvas>
    </main>

    <!-- Sound & Game Logic Engine -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Auto Resize Canvas agar selalu Fullscreen pas di HP/Tablet/Laptop
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60; // Kurangi tinggi header
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let gameTimer = null;
        let spawnerTimer = null;
        let items = [];
        let particles = []; // Efek partikel ledakan saat diklik

        const scoreVal = document.getElementById('scoreVal');
        const timeVal = document.getElementById('timeVal');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScore = document.getElementById('finalScore');

        // Web Audio API untuk Efek Suara Tanpa File Eksternal
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'good') {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'bad') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            items = [];
            particles = [];
            scoreVal.textContent = score;
            timeVal.textContent = timeLeft + 's';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            isPlaying = true;

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                timeVal.textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);

            if (spawnerTimer) clearInterval(spawnerTimer);
            spawnerTimer = setInterval(() => {
                if (!isPlaying) return;
                spawnItem();
            }, 500);

            loop();
        }

        function spawnItem() {
            const isBad = Math.random() < 0.25;
            const emojis = isBad ? ['🗑️', '💀', '🧦'] : ['🍔', '🍕', '🌭', '🥤', '🍗'];
            
            items.push({
                x: Math.random() * (canvas.width - 80) + 40,
                y: -50,
                vy: 3 + Math.random() * 3,
                size: 36,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
                isBad: isBad,
                angle: 0,
                spin: (Math.random() - 0.5) * 0.05
            });
        }

        // Deteksi klik / sentuh layar di seluruh area canvas fullscreen
        canvas.addEventListener('pointerdown', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                let dist = Math.hypot(item.x - clickX, item.y - clickY);
                
                if (dist < item.size) {
                    if (item.isBad) {
                        score = Math.max(0, score - 3);
                        playSound('bad');
                        createParticles(item.x, item.y, '#f43f5e');
                    } else {
                        score += 5;
                        playSound('good');
                        createParticles(item.x, item.y, '#10b981');
                    }
                    scoreVal.textContent = score;
                    items.splice(i, 1);
                    break;
                }
            }
        });

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 20,
                    color: color
                });
            }
        }

        function loop() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background efek gradasi halus
            let bgGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, canvas.width);
            bgGrad.addColorStop(0, '#0f172a');
            bgGrad.addColorStop(1, '#090d16');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Render Partikel Ledakan
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update & Render Item Game
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.vy;
                item.angle += item.spin;

                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.angle);
                ctx.font = `${item.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.emoji, 0, 0);
                ctx.restore();

                // Hapus jika keluar layar bawah
                if (item.y > canvas.height + 60) {
                    items.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearInterval(spawnerTimer);
            finalScore.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
