<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapur Panik - The Chaos Arcade</title>
    <meta name="description" content="Mainkan game Dapur Panik secara solo langsung di browser. Tangkap makanan dan hindari sampah!">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        neonpink: '#f43f5e',
                        neongreen: '#10b981',
                        neonpurple: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased selection:bg-neonpink selection:text-white flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-darkbg/80 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-slate-300 hover:text-neonpink text-sm font-semibold transition flex items-center gap-1">
                ← Kembali ke Portal
            </a>
            <h1 class="text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-neonpink to-neongreen">
                DAPUR PANIK 🍳
            </h1>
        </div>
    </header>

    <!-- Game Arena -->
    <main class="max-w-xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
        <div class="bg-slate-900 border-2 border-neonpink rounded-3xl p-6 shadow-2xl shadow-neonpink/10">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                <div>
                    <h3 class="text-xl font-black text-white">Solo Madness</h3>
                    <p class="text-slate-400 text-xs mt-1">Klik <span class="text-neongreen font-bold">makanan</span>, hindari <span class="text-neonpink font-bold">sampah</span>!</p>
                </div>
                <div class="flex gap-3 text-center">
                    <div class="bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                        <span class="block text-[9px] text-slate-400 uppercase">Skor</span>
                        <span id="scoreVal" class="text-lg font-black text-neongreen">0</span>
                    </div>
                    <div class="bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                        <span class="block text-[9px] text-slate-400 uppercase">Waktu</span>
                        <span id="timeVal" class="text-lg font-black text-neonpink">30s</span>
                    </div>
                </div>
            </div>

            <!-- Area Kanvas Game -->
            <div id="gameScreen" class="relative h-72 bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex items-center justify-center cursor-crosshair">
                
                <!-- Start Overlay -->
                <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-20">
                    <span class="text-4xl mb-3">🔥</span>
                    <h4 class="text-xl font-bold text-white mb-2">Siap Masak Rusuh?</h4>
                    <p class="text-slate-400 text-xs max-w-xs mb-6">Waktu cuma 30 detik. Kumpulin skor sebanyak mungkin!</p>
                    <button onclick="startGame()" class="bg-neonpink hover:bg-rose-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:scale-105 text-sm">
                        Mulai Main!
                    </button>
                </div>

                <!-- Game Over Overlay -->
                <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/90 hidden flex flex-col items-center justify-center p-6 text-center z-20">
                    <span class="text-4xl mb-2">💥</span>
                    <h4 class="text-2xl font-black text-neonpink mb-1">Waktu Habis!</h4>
                    <p class="text-slate-300 text-xs mb-4">Skor Akhir: <span id="finalScore" class="font-bold text-neongreen text-base">0</span></p>
                    <button onclick="startGame()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-xl transition text-sm">
                        Main Lagi 🔄
                    </button>
                </div>

                <div id="itemContainer" class="absolute inset-0 pointer-events-none"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 The Chaos Arcade</p>
    </footer>

    <!-- Script Game -->
    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let spawnerInterval = null;
        let isPlaying = false;

        const scoreVal = document.getElementById('scoreVal');
        const timeVal = document.getElementById('timeVal');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const itemContainer = document.getElementById('itemContainer');
        const finalScore = document.getElementById('finalScore');

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreVal.textContent = score;
            timeVal.textContent = timeLeft + 's';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            itemContainer.innerHTML = '';
            isPlaying = true;

            gameInterval = setInterval(() => {
                timeLeft--;
                timeVal.textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);

            spawnerInterval = setInterval(() => {
                if (isPlaying) spawnItem();
            }, 600);
        }

        function spawnItem() {
            const item = document.createElement('div');
            item.classList.add('absolute', 'cursor-pointer', 'transition-transform', 'duration-150', 'hover:scale-125', 'pointer-events-auto');
            
            const maxX = itemContainer.clientWidth - 50;
            const maxY = itemContainer.clientHeight - 50;
            item.style.left = Math.floor(Math.random() * Math.max(maxX, 10)) + 'px';
            item.style.top = Math.floor(Math.random() * Math.max(maxY, 10)) + 'px';

            const isBad = Math.random() < 0.25;
            const emojis = isBad ? ['🗑️', '🧦', '💀'] : ['🍔', '🍕', '🌭', '🥤'];
            item.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            item.style.fontSize = '2rem';

            item.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                if (!isPlaying) return;
                
                if (isBad) {
                    score = Math.max(0, score - 3);
                    item.style.transform = 'scale(0.5)';
                } else {
                    score += 5;
                    item.style.transform = 'scale(1.5)';
                }
                scoreVal.textContent = score;
                item.remove();
            });

            itemContainer.appendChild(item);

            setTimeout(() => {
                if (item.parentElement) item.remove();
            }, 1200);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnerInterval);
            itemContainer.innerHTML = '';
            finalScore.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
