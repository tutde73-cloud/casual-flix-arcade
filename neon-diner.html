<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Diner - Casual Flix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05050a; font-family: monospace; touch-action: none; }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none text-white">

    <header class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 py-3 bg-slate-950/80 border-b border-slate-800 backdrop-blur-md z-30 pointer-events-none">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white pointer-events-auto">← EXIT</a>
        <div class="flex gap-4 text-xs font-black">
            <span class="text-yellow-400">SCORE: <span id="scoreVal">0</span></span>
            <span class="text-rose-500">TIME: <span id="timeVal">45s</span></span>
        </div>
    </header>

    <div class="relative w-full h-full flex items-center justify-center bg-slate-950">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>
    </div>

    <div id="startOverlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-40">
        <h1 class="text-3xl md:text-5xl font-black text-yellow-400 mb-2">NEON DINER 🍳</h1>
        <p class="text-slate-400 text-xs max-w-xs mb-6">Catch fresh ingredients with simple tap buttons.</p>
        <button onclick="startGame()" class="bg-yellow-500 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg active:scale-95 transition">START COOKING 🚀</button>
    </div>

    <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/95 hidden flex flex-col items-center justify-center p-6 text-center z-40">
        <h2 class="text-3xl font-black text-rose-500 mb-2">TIME'S UP!</h2>
        <p class="text-slate-300 text-sm mb-4">Final Score: <span id="finalScore" class="font-bold text-yellow-400">0</span></p>
        <button onclick="startGame()" class="bg-yellow-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl">PLAY AGAIN 🔄</button>
    </div>

    <div class="absolute bottom-6 left-0 right-0 flex justify-between px-8 z-30 pointer-events-none">
        <button id="leftBtn" class="pointer-events-auto w-16 h-16 bg-slate-900/80 border border-slate-700 rounded-2xl text-white font-bold text-xl active:bg-yellow-500 active:text-slate-950 transition">◀</button>
        <button id="rightBtn" class="pointer-events-auto w-16 h-16 bg-slate-900/80 border border-slate-700 rounded-2xl text-white font-bold text-xl active:bg-yellow-500 active:text-slate-950 transition">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let score = 0, timeLeft = 45, isPlaying = false;
        let timer, spawner, player = { x: canvas.width/2 - 35, y: canvas.height - 130, width: 70, height: 50, speed: 10 };
        let items = [], keys = { left: false, right: false };

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            score = 0; timeLeft = 45; items = [];
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('timeVal').textContent = timeLeft + 's';
            isPlaying = true;

            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeVal').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);

            if (spawner) clearInterval(spawner);
            spawner = setInterval(() => {
                if (!isPlaying) return;
                items.push({ x: Math.random() * (canvas.width - 40), y: -40, size: 30, speed: 3 + Math.random() * 2, isBad: Math.random() < 0.25 });
            }, 1000);
        }

        const bindTouch = (id, dir) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys[dir] = true);
            btn.addEventListener('mouseup', () => keys[dir] = false);
        };
        bindTouch('leftBtn', 'left'); bindTouch('rightBtn', 'right');

        function update() {
            if (!isPlaying) return;
            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;
            player.x = Math.max(10, Math.min(canvas.width - player.width - 10, player.x));

            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i]; itm.y += itm.speed;
                if (itm.x < player.x + player.width && itm.x + itm.size > player.x && itm.y < player.y + player.height && itm.y + itm.size > player.y) {
                    score += itm.isBad ? -3 : 5;
                    score = Math.max(0, score);
                    document.getElementById('scoreVal').textContent = score;
                    items.splice(i, 1);
                    continue;
                }
                if (itm.y > canvas.height) items.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f172a'; ctx.fillRect(canvas.width / 2 - 100, 50, 200, 120);
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

            items.forEach(itm => {
                ctx.fillStyle = itm.isBad ? '#f43f5e' : '#eab308';
                ctx.beginPath(); ctx.arc(itm.x + itm.size/2, itm.y + itm.size/2, itm.size/2, 0, Math.PI * 2); ctx.fill();
            });

            ctx.fillStyle = '#10b981'; ctx.fillRect(player.x, player.y, player.width, player.height);

            if (isPlaying) { update(); requestAnimationFrame(draw); }
        }

        function endGame() {
            isPlaying = false; clearInterval(timer); clearInterval(spawner);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }
        draw();
    </script>
</body>
</html>
