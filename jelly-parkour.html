<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelly Jatuh 3D - The Chaos Arcade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #05050a; font-family: sans-serif;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen select-none">

    <!-- Top UI -->
    <header class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 py-3 bg-slate-900/80 border-b border-slate-800 backdrop-blur-md z-30 pointer-events-none">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white pointer-events-auto">← Keluar</a>
        <div class="flex gap-3 text-xs font-black">
            <span id="levelBadge" class="bg-slate-800 px-2.5 py-1 rounded-md text-yellow-400 border border-slate-700">LVL 1</span>
            <span class="text-yellow-400 self-center">JARAK: <span id="scoreVal">0m</span></span>
            <span class="text-rose-500 self-center">NYAWA: <span id="hpVal">❤️❤️❤️</span></span>
        </div>
    </header>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <!-- Start & Game Over Overlays -->
    <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-40">
        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-2">
            JELLY JATUH 🍮
        </h1>
        <p class="text-slate-400 text-xs max-w-xs mb-6">
            Lompati rintangan balok es di jalur 3D! Lewati berbagai level tantangan ekstrem.
        </p>
        <button onclick="initJellyGame()" class="bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg">
            Mulai Mendaki 🚀
        </button>
    </div>

    <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/90 hidden flex flex-col items-center justify-center p-6 text-center z-40">
        <h2 class="text-3xl font-black text-rose-500 mb-2">TERPELSET!</h2>
        <p class="text-slate-300 text-sm mb-1">Pencapaian: <span id="finalLevel" class="font-bold text-yellow-400">Level 1</span></p>
        <p class="text-slate-300 text-sm mb-4">Total Jarak: <span id="finalScore" class="font-bold text-yellow-400">0m</span></p>
        <button onclick="initJellyGame()" class="bg-yellow-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl">
            Coba Lagi 🔄
        </button>
    </div>

    <!-- Mobile Virtual Button / Tap to Jump -->
    <div class="absolute bottom-6 left-0 right-0 flex justify-center z-30 pointer-events-none">
        <button id="jumpBtn" class="pointer-events-auto bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-950 font-black px-12 py-4 rounded-2xl shadow-xl text-base uppercase active:scale-95 transition">
            LOMPAT 🧗‍♂️
        </button>
    </div>

    <!-- Script Game 3D Jelly dengan Sistem Level -->
    <script>
        let scene, camera, renderer, jelly;
        let distance = 0, hp = 3, currentLevel = 1, isPlaying = false;
        let gameLoop, obstacleSpawner;
        let obstacles = [];
        let isJumping = false, jumpVel = 0;

        function initJellyGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            
            distance = 0;
            hp = 3;
            currentLevel = 1;
            document.getElementById('scoreVal').textContent = '0m';
            document.getElementById('hpVal').textContent = '❤️❤️❤️';
            document.getElementById('levelBadge').textContent = 'LVL 1';

            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            if (!scene) {
                setupJellyScene();
            }

            isPlaying = true;
            if (gameLoop) cancelAnimationFrame(gameLoop);
            if (obstacleSpawner) clearInterval(obstacleSpawner);

            restartSpawner();
            animateJelly();
        }

        function restartSpawner() {
            if (obstacleSpawner) clearInterval(obstacleSpawner);
            // Makin tinggi level, spawn rintangan makin cepat
            let spawnInterval = currentLevel === 1 ? 1600 : (currentLevel === 2 ? 1200 : 850);
            obstacleSpawner = setInterval(spawnObstacle, spawnInterval);
        }

        function setupJellyScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);
            scene.fog = new THREE.FogExp2(0x05050a, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            const trackGeo = new THREE.PlaneGeometry(8, 100);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -40;
            scene.add(track);

            const jellyGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const jellyMat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.3, emissive: 0x403000 });
            jelly = new THREE.Mesh(jellyGeo, jellyMat);
            jelly.position.set(0, 0.8, 0);
            scene.add(jelly);

            const triggerJump = () => {
                if (!isPlaying || isJumping) return;
                isJumping = true;
                jumpVel = 0.25;
            };

            document.getElementById('jumpBtn').addEventListener('pointerdown', triggerJump);
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') triggerJump();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function spawnObstacle() {
            if (!isPlaying) return;
            const geo = new THREE.BoxGeometry(2, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color: currentLevel === 3 ? #ef4444 : 0xf43f5e });
            const obs = new THREE.Mesh(geo, mat);

            obs.position.set((Math.random() - 0.5) * 4, 0.5, -50);
            scene.add(obs);
            obstacles.push(obs);
        }

        function animateJelly() {
            if (!isPlaying) return;

            distance += 1;
            document.getElementById('scoreVal').textContent = distance + 'm';

            // --- SISTEM PROGRESS LEVEL BERDASARKAN JARAK ---
            let newLevel = currentLevel;
            if (distance >= 100) newLevel = 3;
            else if (distance >= 50) newLevel = 2;

            if (newLevel !== currentLevel) {
                currentLevel = newLevel;
                document.getElementById('levelBadge').textContent = 'LVL ' + currentLevel;
                restartSpawner(); // Update kecepatan kemunculan rintangan
            }

            // Kecepatan gerak rintangan bertambah tiap level
            let obsSpeed = currentLevel === 1 ? 0.35 : (currentLevel === 2 ? 0.5 : 0.65);

            if (isJumping) {
                jelly.position.y += jumpVel;
                jumpVel -= 0.015;
                if (jelly.position.y <= 0.8) {
                    jelly.position.y = 0.8;
                    isJumping = false;
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += obsSpeed;

                if (jelly.position.distanceTo(obs.position) < 1.2 && jelly.position.y < 1.2) {
                    hp--;
                    document.getElementById('hpVal').textContent = '❤️'.repeat(Math.max(0, hp)) + '🖤'.repeat(3 - Math.max(0, hp));
                    scene.remove(obs);
                    obstacles.splice(i, 1);

                    if (hp <= 0) {
                        endJellyGame();
                        return;
                    }
                }

                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            camera.position.set(jelly.position.x, jelly.position.y + 3, jelly.position.z + 5);
            camera.lookAt(jelly.position.x, jelly.position.y, jelly.position.z - 5);

            renderer.render(scene, camera);
            gameLoop = requestAnimationFrame(animateJelly);
        }

        function endJellyGame() {
            isPlaying = false;
            cancelAnimationFrame(gameLoop);
            clearInterval(obstacleSpawner);
            document.getElementById('finalScore').textContent = distance + 'm';
            document.getElementById('finalLevel').textContent = 'Level ' + currentLevel;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
